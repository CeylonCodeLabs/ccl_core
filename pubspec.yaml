name: ccl_core
description: "CeylonCodeLabs Core Extension in favor of flutter_support_pack"
version: 0.9.0
homepage: https://github.com/CeylonCodeLabs/ccl_packages

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: '>=4.0.0 <5.0.0'
  firebase_crashlytics: '>=5.0.0 <6.0.0'
  intl: '>=0.17.0 <0.21.0'
  googleapis: '>=14.0.0 <16.0.0'
  googleapis_auth: '>=2.0.0 <3.0.0'
  talker: '>=5.0.0 <6.0.0'
  talker_flutter: '>=5.0.0 <6.0.0'
  talker_dio_logger: '>=5.0.0 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  build_runner: ^2.6.0
  dart_code_metrics_presets: ^2.24.0

scripts:
  gen_docs: git-chglog -o CHANGELOG.md && git log --pretty="- %s (%an)" $(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1))..HEAD > release_note.txt